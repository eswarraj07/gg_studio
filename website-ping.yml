
name: Keep Render Website Active

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-website:
    runs-on: ubuntu-latest

    timeout-minutes: 2

    steps:
      - name: Ping ggstudio.info
        run: |
          echo "Pinging website..."
          curl --fail --location \
            --max-time 60 \
            --silent --show-error \
            --output /dev/null \
            --write-out "HTTP Status: %{http_code}\n" \
            https://ggstudio.info/
